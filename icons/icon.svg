<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Shield Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background (Squircle / Rounded Card) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="#334155" stroke-width="6" />

  <!-- Shield Motif -->
  <g filter="url(#glow)">
    <!-- Main Shield Outline/Body -->
    <path d="M 256,120 
             C 320,120 370,100 390,80
             C 390,200 390,320 256,410
             C 122,320 122,200 122,80
             C 142,100 192,120 256,120 Z" 
          fill="none" 
          stroke="url(#accent-grad)" 
          stroke-width="16" 
          stroke-linejoin="round" />

    <!-- Upward Trending Path / Arrow of Recovery -->
    <path d="M 190,320 
             C 210,260 250,220 310,180" 
          fill="none" 
          stroke="#22d3ee" 
          stroke-width="18" 
          stroke-linecap="round" />
          
    <path d="M 260,174
             L 322,172
             L 320,234"
          fill="none"
          stroke="#22d3ee"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Glowing Star at the Center of Recovery -->
  <path d="M 256,236 L 262,250 L 276,256 L 262,262 L 256,276 L 250,262 L 236,256 L 250,250 Z" fill="#ffffff" />
</svg>
